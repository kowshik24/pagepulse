name: Auto Tag

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-tag]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and push tag
        id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.RELEASE_PAT }}
          tag_prefix: v
          release_branches: main
          default_bump: patch
          major_pattern: "BREAKING CHANGE"
          minor_pattern: "^feat"

      - name: Tag summary
        if: steps.tagger.outputs.new_tag != ''
        run: |
          echo "Created tag: ${{ steps.tagger.outputs.new_tag }}"
